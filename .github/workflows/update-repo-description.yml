name: Update repository description

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-repo-description.yml'

permissions:
  contents: read

jobs:
  update-description:
    runs-on: ubuntu-latest
    steps:
      - name: Update About description
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --method PATCH "repos/$GH_REPO" \
            -f description='Local-first agent desktop app with durable execution, long-term memory, and an integrated workspace.'
