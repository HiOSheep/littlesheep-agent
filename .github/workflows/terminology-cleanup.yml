name: Terminology cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/terminology-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Normalize public documentation terminology
        shell: python
        run: |
          from pathlib import Path

          root = Path('.')
          targets = [root / 'README.md']
          targets += list((root / 'docs').rglob('*.md'))
          targets += list((root / 'packages').rglob('README.md'))

          # Historical taskbooks intentionally keep the language used at the time.
          targets = [p for p in targets if 'docs/taskbooks/' not in p.as_posix()]

          replacements = [
              ('代码级状态机', '显式执行状态模型'),
              ('代码级 stage', '显式执行阶段'),
              ('代码级 Stage', '显式执行阶段'),
              ('硬控制流状态机', '核心 Agent Runtime'),
              ('硬控制流 Agent', '确定性 Agent Runtime'),
              ('硬控制流', '确定性执行流'),
              ('固定安全脊柱', '不可绕过的核心安全约束'),
              ('安全脊柱', '核心安全约束'),
              ('固定脊柱', '固定核心约束'),
              ('稳定门面', '稳定公共接口'),
              ('Memory 门面', 'Memory 公共接口'),
              ('消费门面', '消费接口'),
              ('暴露门面', '暴露公共接口'),
              ('门面', '公共接口'),
              ('第一工程门', '首要验收项'),
              ('工程门通过', '工程验收通过'),
              ('工程门未通过', '工程验收未通过'),
              ('工程门', '工程验收'),
              ('质量门', '质量检查'),
              ('阶段门', '阶段验收'),
              ('失败关闭', '默认拒绝'),
              ('信任闸门', '信任校验'),
              ('审批闸门', '授权检查'),
              ('写入闸门', '写入策略校验'),
              ('安全闸门', '安全校验'),
              ('准入闸门', '准入校验'),
              ('证据闸门', '证据校验'),
              ('闸门', '校验'),
              ('真实 Electron + DeepSeek', '实际 Electron 进程 + DeepSeek API'),
              ('真实 Electron', '实际 Electron 进程'),
              ('真实 DeepSeek', 'DeepSeek API 实测'),
              ('真实 Provider', '实际 Provider'),
              ('真实外部系统副作用', '外部系统副作用'),
              ('真实负载', '实际负载'),
              ('默认无感', '默认隐藏实现复杂度'),
              ('用户无感', '用户无需感知内部复杂度'),
              ('高自治 Agent', '可持续自主执行任务的 Agent'),
          ]

          changed = []
          for path in sorted(set(targets)):
              if not path.is_file():
                  continue
              before = path.read_text(encoding='utf-8')
              after = before
              for old, new in replacements:
                  after = after.replace(old, new)
              if after != before:
                  path.write_text(after, encoding='utf-8', newline='\n')
                  changed.append(path.as_posix())

          print(f'changed {len(changed)} files')
          for path in changed:
              print(path)

      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No terminology changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs packages
          git commit -m 'docs: normalize repository terminology'
          git push
